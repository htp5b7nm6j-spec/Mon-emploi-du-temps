<style>
:root{--bg:#080d19;--card:#111a2c;--card2:#18243b;--text:#f5f7ff;--muted:#9aa8c4;--accent:#70a7ff;--green:#45d6a0;--orange:#ffb65a;--purple:#d8b4fe;--cyan:#67e8f9;--line:#293754;--danger:#ff7180}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(135deg,#070b15,#101a30);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{padding:25px 4%;border-bottom:1px solid var(--line);background:rgba(8,13,25,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}h1{margin:0 0 6px;font-size:29px}header p{margin:0;color:var(--muted)}
main{width:min(1550px,95%);margin:22px auto 60px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--accent)}.btn.danger:hover{border-color:var(--danger);color:#ffd3d7}
.calendarbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}.calendar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.month-title{font-size:22px;font-weight:800;text-transform:capitalize}.calendar-actions{display:flex;gap:7px;flex-wrap:wrap}.date-strip{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;margin-top:12px}.date-cell{border:1px solid var(--line);background:#0e1729;border-radius:10px;padding:9px;text-align:center;cursor:pointer}.date-cell:hover,.date-cell.active{border-color:var(--accent);background:#16243c}.date-cell .dow{font-size:11px;color:var(--muted);text-transform:uppercase}.date-cell .num{font-size:20px;font-weight:800;margin-top:3px}.date-cell .today{color:var(--green)}
.week{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}.day{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:170px}.day h2{font-size:18px;margin:0;padding:12px;background:var(--card2);text-align:center}.day h2 small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}.slot{padding:10px;border-top:1px solid var(--line)}.time{font-size:12px;color:var(--muted);margin-bottom:7px}.event{border:1px solid var(--line);border-radius:10px;padding:11px;background:#0f1728;cursor:pointer;transition:.18s}.event:hover{transform:translateY(-2px);border-color:var(--accent);background:#16223a}.event strong{display:block;font-size:14px}.event small{display:block;color:var(--muted);margin-top:5px}.event .edit-mini{float:right;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}.workout{color:var(--green);font-weight:700}.revision{color:var(--orange);font-weight:700}.course{color:#c7d2fe;font-weight:700}.prof{color:var(--purple);font-weight:700}.cardio{color:var(--cyan);font-weight:700}
.panel{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:none}.panel.active{display:block}.panel-top{display:flex;justify-content:space-between;gap:20px;align-items:center}.panel h2{margin:0}.close{border:0;background:#263451;color:white;border-radius:9px;padding:9px 13px;cursor:pointer}.section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.section h3{margin:0 0 12px}.notearea,.exercise-input,.link-input,.field{width:100%;background:#0b1323;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;outline:none}.notearea:focus,.exercise-input:focus,.link-input:focus,.field:focus{border-color:var(--accent)}.notearea{min-height:125px;resize:vertical}.links{display:grid;gap:8px}.linkrow{display:flex;gap:8px}.linkrow .link-input{flex:1}.remove-link{border:1px solid var(--line);background:#1b263d;color:#fff;border-radius:9px;padding:0 12px;cursor:pointer}.save-status{color:var(--green);font-size:13px;min-height:18px;margin-top:7px}.exercise{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.exercise input[type=checkbox]{width:19px;height:19px;accent-color:var(--green)}.exercise-main{flex:1;min-width:0}.exercise-grid{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:8px}.exercise-actions{display:flex;gap:6px}.iconbtn{border:1px solid var(--line);background:#17223a;color:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.iconbtn:hover{border-color:var(--accent)}.iconbtn.delete:hover{border-color:var(--danger);color:#ffd3d7}.addbar{display:flex;gap:8px;margin-top:12px}.addbar input{flex:1}.muted{color:var(--muted);font-size:13px}.prof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.prof-card{background:#0d1627;border:1px solid var(--line);border-radius:12px;padding:14px}.prof-card h4{margin:0 0 5px;color:var(--purple)}.prof-card .timebig{font-weight:700;margin-bottom:10px}.prof-card textarea{min-height:110px}.footer-note{margin-top:15px;color:var(--muted);font-size:13px}.empty{color:var(--muted);font-style:italic}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal-backdrop.open{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field-group{display:grid;gap:6px}.field-group.full{grid-column:1/-1}.field-group label{font-size:13px;color:var(--muted);font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}.danger-text{color:var(--danger)}
@media(max-width:950px){.week{grid-template-columns:repeat(7,190px)}.date-strip{grid-template-columns:repeat(7,120px);overflow-x:auto}.prof-grid{grid-template-columns:1fr}.exercise-grid{grid-template-columns:1fr}.panel-top{align-items:flex-start}.form-grid{grid-template-columns:1fr}.field-group.full{grid-column:auto}}

/* Mobile app layout — contenu et logique inchangés */
@media(max-width:600px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  header{padding:16px 14px;position:sticky;top:0}
  h1{font-size:22px}
  header p{font-size:12px;line-height:1.4}
  main{width:100%;margin:12px auto 40px;padding:0 10px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .toolbar .btn{padding:10px 8px;font-size:12px;min-height:42px}
  .calendarbar{padding:10px;border-radius:14px}
  .calendar-top{align-items:stretch}
  .month-title{font-size:18px}
  .calendar-actions{width:100%}
  .calendar-actions .btn{width:100%}
  .date-strip{display:flex;overflow-x:auto;gap:6px;margin-top:9px;padding-bottom:3px;scrollbar-width:none}
  .date-strip::-webkit-scrollbar{display:none}
  .date-cell{flex:0 0 74px;padding:8px 5px}
  .date-cell .num{font-size:18px}
  .week{display:flex;overflow-x:auto;gap:9px;padding-bottom:10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .day{flex:0 0 calc(100vw - 20px);min-width:0;scroll-snap-align:start}
  .day h2{font-size:17px}
  .slot{padding:9px}
  .event{padding:12px}
  .event strong{font-size:14px}
  .panel{padding:14px;margin-top:14px;border-radius:15px}
  .panel-top{gap:10px}
  .panel h2{font-size:19px}
  .section{margin-top:16px;padding-top:14px}
  .prof-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .field-group.full{grid-column:auto}
  .modal-backdrop{padding:8px}
  .modal{padding:15px;border-radius:15px;max-height:94vh}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr}
  .modal-actions .btn:first-child{grid-column:1/-1}
  .modal-actions .btn{width:100%}
  .exercise-grid{grid-template-columns:1fr}
  .exercise-actions{flex-shrink:0}
  .addbar{display:grid;grid-template-columns:1fr}
  .addbar input{max-width:none!important}
}

<body>
<header><h1>📅 Mon emploi du temps</h1><p>FAC — Groupe A1 • Sport • Révisions • Prof • Notes personnelles</p></header>
<main>
  <div class="toolbar">
    <button class="btn" id="todayBtn">📍 Aujourd'hui</button>
    <button class="btn" id="prevBtn">‹ Semaine précédente</button>

  </div>
  <section class="calendarbar">
    <div class="calendar-top"><div class="month-title" id="monthTitle"></div><div class="calendar-actions"><button class="btn" id="editModeBtn">✏️ Modifier l'emploi du temps</button></div></div>
    <div class="date-strip" id="dateStrip"></div>
  </section>
  <section class="week" id="week"></section>
  <section class="panel" id="panel"><div class="panel-top"><div><h2 id="panelTitle"></h2><div id="panelSubtitle" class="muted"></div></div><button class="close" id="closePanel">Fermer</button></div><div id="panelContent"></div></section>
</main>
<div class="modal-backdrop" id="editorModal"><div class="modal"><h2>✏️ Modifier cette case</h2><p class="muted" id="editorDateLabel"></p><form id="eventForm"><div class="form-grid"><div class="field-group"><label for="eventTime">Horaire</label><input class="field" id="eventTime" required placeholder="08h–09h30"></div><div class="field-group"><label for="eventType">Type</label><select class="field" id="eventType"><option value="course">Cours</option><option value="revision">Révision</option><option value="workout">Sport</option><option value="prof">Prof</option><option value="cardio">Cardio</option></select></div><div class="field-group full"><label for="eventTitle">Nom</label><input class="field" id="eventTitle" required placeholder="Ex. Analyse"></div></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteEventBtn">Supprimer cette case</button><button type="button" class="btn" id="cancelEditBtn">Annuler</button><button type="submit" class="btn">Enregistrer</button></div></form></div></div>
<script>
const baseSchedule={
Dimanche:[['08h–09h30','Analyse — Cours','course'],['09h30–11h','Mécanique des fluides — Cours','course'],['11h–13h','Révision','revision'],['14h–17h','TP Physique / Chimie — A1/A2','course'],['17h–19h','PUSH','workout','workout:PUSH']],
Lundi:[['08h–09h30','Mécanique rationnelle — Cours','course'],['09h30–11h','Analyse numérique — Cours','course'],['11h–12h30','Électricité — Cours','course'],['14h–17h','TD Analyse numérique / Mécanique rationnelle — A1/A2','course'],['19h–22h','Révision','revision']],
Mardi:[['08h–09h30','Physique — Cours','course'],['09h30–11h','Physique / Chimie — Cours','course'],['11h–12h30','Chimie — Cours','course'],['14h–17h','TD Électricité / TP Sciences — A1/A2','course'],['17h–19h30','PULL','workout','workout:PULL']],
Mercredi:[['08h–09h30','Computer Science — Cours','course'],['09h30–12h30','TD Analyse / Physique — A1/A2','course'],['14h–17h','TP Analyse numérique / Engineering — A1/A2','course'],['18h–20h','Révision','revision']],
Jeudi:[['08h–09h30','Analyse — Cours','course'],['09h30–12h30','TD Mécanique des fluides / Chimie — A1/A2','course'],['14h–17h','Français / Anglais — A1/A2','course'],['20h–22h','FULL BODY','workout','workout:FULL BODY']],
Vendredi:[['Matin','Cardio','cardio'],['17h–21h','Révision','revision']],
Samedi:[['08h–16h','Prof','prof','prof'],['17h–19h','LEGS','workout','workout:LEGS'],['22h–23h30','Révision','revision']]
};
const defaultWorkouts={PUSH:[['Développé incliné lourd','3 séries'],['Développé couché','10 × 10'],['Tirage frontal triceps','3 séries'],['Extension triceps à une main','3 séries'],['3e exercice triceps','3 séries']],PULL:[['Tractions lestées','10 séries'],['Tirage horizontal','Séries non précisées'],['Machine Row','Séries non précisées'],['Curl « cul sur banc »','Séries non précisées'],['Curl marteau','Séries non précisées'],['Curl à la poulie','Séries non précisées'],['Élévations latérales courtes','Séries non précisées']], 'FULL BODY':[['Écartés pec — position 1','Séries non précisées'],['Écartés pec — position 2','Séries non précisées'],['Tirage vertical','Séries non précisées'],['Tirage horizontal à une main','Séries non précisées'],['Deadlift jambes tendues','Séries non précisées'],['Leg curl','Séries non précisées'],['Élévations latérales + développé militaire','Superset'],['Curl barre + curl marteau','Superset']],LEGS:[['Squat','6 séries'],['Leg extension','Séries non précisées'],['Leg curl','Séries non précisées'],['Adducteurs','Séries non précisées'],['Fentes','Séries non précisées'],['Mollets','Séries non précisées']]};
const profGroups=[{id:'math3',name:'Mathématiques',time:'09h00–11h00',level:'3ème CEM'},{id:'phys3',name:'Physique',time:'12h30–14h00',level:'3ème CEM'},{id:'physbrevet',name:'Physique',time:'14h30–16h00',level:'Brevet'}];
const dayNames=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const monthNames=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let workouts=load('workouts',structuredClone(defaultWorkouts)),notes=load('notes',{}),links=load('links',{}),checks=load('checks',{}),profNotes=load('profNotes',{}),dateOverrides=load('dateOverrides',{});
let selectedDate=startOfWeek(new Date()), editing={dateKey:null,index:null};
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}
function dayDate(i){const d=new Date(selectedDate);d.setDate(d.getDate()+i);return d}
function keyFor(day,time,title){return `${day}|${time}|${title}`}
function eventsForDate(d){const dk=dateKey(d);if(dateOverrides[dk])return dateOverrides[dk];return baseSchedule[dayNames[d.getDay()]]||[]}
function setEventsForDate(d,events){dateOverrides[dateKey(d)]=events;save('dateOverrides',dateOverrides)}
function render(){renderCalendar();renderWeek()}
function renderCalendar(){const strip=document.getElementById('dateStrip');strip.innerHTML='';const days=[];for(let i=0;i<7;i++)days.push(dayDate(i));const first=days[0],last=days[6];document.getElementById('monthTitle').textContent=first.getMonth()===last.getMonth()?`${monthNames[first.getMonth()]} ${first.getFullYear()}`:`${monthNames[first.getMonth()]} – ${monthNames[last.getMonth()]} ${last.getFullYear()}`;days.forEach((d,i)=>{const el=document.createElement('button');el.className='date-cell'+(dateKey(d)===dateKey(selectedDate)?' active':'');el.type='button';const isToday=dateKey(d)===dateKey(new Date());el.innerHTML=`<div class="dow">${dayNames[d.getDay()]}</div><div class="num ${isToday?'today':''}">${d.getDate()}</div>`;el.addEventListener('click',()=>{selectedDate=startOfWeek(d);render()});strip.appendChild(el)})}
function renderWeek(){const week=document.getElementById('week');week.innerHTML='';for(let i=0;i<7;i++){const d=dayDate(i),day=dayNames[d.getDay()],events=eventsForDate(d),col=document.createElement('div');col.className='day';col.innerHTML=`<h2>${day}<small>${d.getDate()} ${monthNames[d.getMonth()]}</small></h2>`;events.forEach((e,index)=>{const [time,title,type,action]=e;const slot=document.createElement('div');slot.className='slot';const k=keyFor(dateKey(d),time,title),hasNote=(notes[k]||'').trim()||((links[k]||[]).length>0);let hint=type==='workout'?'Modifier la séance →':type==='prof'?'Voir les groupes →':hasNote?'Notes enregistrées →':'Cliquer pour ouvrir →';slot.innerHTML=`<div class="time">${escapeHTML(time)}</div><div class="event"><button class="edit-mini" title="Modifier cette case">✏️</button><strong class="${type}">${escapeHTML(title)}</strong><small>${hint}</small></div>`;slot.querySelector('.event').addEventListener('click',()=>openCase(d,time,title,type,action||'',index));slot.querySelector('.edit-mini').addEventListener('click',e=>{e.stopPropagation();openEditor(d,index)});col.appendChild(slot)});const add=document.createElement('button');add.className='btn';add.style.margin='10px';add.textContent='+ Ajouter une case';add.addEventListener('click',()=>openEditor(d,null));col.appendChild(add);week.appendChild(col)}}
function openCase(d,time,title,type,action,index){const panel=document.getElementById('panel');document.getElementById('panelTitle').textContent=title;document.getElementById('panelSubtitle').textContent=`${dayNames[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]} • ${time}`;if(action.startsWith('workout:'))openWorkout(action.split(':')[1],d,time,title);else if(type==='workout'&&['PUSH','PULL','FULL BODY','LEGS'].includes(title))openWorkout(title,d,time,title);else if(type==='prof')openProf(d,time,title);else openGeneral(d,time,title);panel.classList.add('active');panel.scrollIntoView({behavior:'smooth',block:'start'})}
function openGeneral(d,time,title){const k=keyFor(dateKey(d),time,title),content=document.getElementById('panelContent');content.innerHTML=`<div class="section"><h3>📝 Brouillon / notes</h3><textarea class="notearea" id="generalNote" placeholder="Écris ici : devoirs, rappels, informations du prof..."></textarea><div class="save-status" id="saveStatus"></div></div><div class="section"><h3>🔗 Liens / fichiers</h3><div class="links" id="linksBox"></div><button class="btn" style="margin-top:10px" id="addLinkBtn">+ Ajouter un lien</button></div>`;document.getElementById('generalNote').value=notes[k]||'';document.getElementById('generalNote').addEventListener('input',()=>{notes[k]=document.getElementById('generalNote').value;save('notes',notes);document.getElementById('saveStatus').textContent='✓ Enregistré automatiquement'});document.getElementById('addLinkBtn').addEventListener('click',()=>addLink(k));renderLinks(k)}
function renderLinks(k){const box=document.getElementById('linksBox');box.innerHTML='';(links[k]||[]).forEach((url,i)=>{const row=document.createElement('div');row.className='linkrow';const input=document.createElement('input');input.className='link-input';input.value=url;input.placeholder='https://...';const b=document.createElement('button');b.className='remove-link';b.textContent='Supprimer';b.addEventListener('click',()=>removeLink(k,i));input.addEventListener('input',e=>{links[k][i]=e.target.value;save('links',links)});row.append(input,b);box.appendChild(row)})}
function addLink(k){if(!links[k])links[k]=[];links[k].push('');save('links',links);renderLinks(k)}function removeLink(k,i){links[k].splice(i,1);save('links',links);renderLinks(k)}
function openWorkout(name,d,time,title){const k=keyFor(dateKey(d),time,title),content=document.getElementById('panelContent');content.innerHTML=`<div class="section"><h3>🏋️ Programme — modifiable directement ici</h3><div id="workoutList"></div><div class="addbar"><input id="newExercise" class="exercise-input" placeholder="Nom du nouvel exercice"><input id="newSets" class="exercise-input" style="max-width:190px" placeholder="Séries / reps"><button class="btn" id="addExerciseBtn">+ Ajouter</button></div></div><div class="section"><h3>📝 Brouillon de la séance</h3><textarea class="notearea" id="workoutNote" placeholder="Charges, répétitions, sensations, consignes..."></textarea><div class="save-status" id="workoutSave"></div></div><div class="section"><h3>🔗 Liens / fichiers</h3><div class="links" id="linksBox"></div><button class="btn" style="margin-top:10px" id="addWorkoutLink">+ Ajouter un lien</button></div>`;renderWorkout(name);document.getElementById('addExerciseBtn').addEventListener('click',()=>addExercise(name));document.getElementById('workoutNote').value=notes[k]||'';document.getElementById('workoutNote').addEventListener('input',()=>{notes[k]=document.getElementById('workoutNote').value;save('notes',notes);document.getElementById('workoutSave').textContent='✓ Enregistré automatiquement'});document.getElementById('addWorkoutLink').addEventListener('click',()=>addLink(k));renderLinks(k)}
function renderWorkout(name){const box=document.getElementById('workoutList');box.innerHTML='';workouts[name].forEach((ex,i)=>{const row=document.createElement('div');row.className='exercise';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!checks[`${name}|${i}`];cb.addEventListener('change',()=>toggleCheck(name,i,cb.checked));const main=document.createElement('div');main.className='exercise-main';const grid=document.createElement('div');grid.className='exercise-grid';const n=document.createElement('input');n.className='exercise-input';n.value=ex[0];const s=document.createElement('input');s.className='exercise-input';s.value=ex[1];n.addEventListener('input',()=>editExercise(name,i,0,n.value));s.addEventListener('input',()=>editExercise(name,i,1,s.value));grid.append(n,s);main.appendChild(grid);const acts=document.createElement('div');acts.className='exercise-actions';const dup=document.createElement('button');dup.className='iconbtn';dup.textContent='⧉';dup.title='Dupliquer';dup.addEventListener('click',()=>duplicateExercise(name,i));const del=document.createElement('button');del.className='iconbtn delete';del.textContent='✕';del.title='Supprimer';del.addEventListener('click',()=>deleteExercise(name,i));acts.append(dup,del);row.append(cb,main,acts);box.appendChild(row)})}
function editExercise(name,i,field,value){workouts[name][i][field]=value;save('workouts',workouts)}function addExercise(name){const n=document.getElementById('newExercise').value.trim(),s=document.getElementById('newSets').value.trim()||'À préciser';if(!n)return;workouts[name].push([n,s]);save('workouts',workouts);document.getElementById('newExercise').value='';document.getElementById('newSets').value='';renderWorkout(name)}function deleteExercise(name,i){if(!confirm('Supprimer cet exercice ?'))return;workouts[name].splice(i,1);save('workouts',workouts);renderWorkout(name)}function duplicateExercise(name,i){workouts[name].splice(i+1,0,[...workouts[name][i]]);save('workouts',workouts);renderWorkout(name)}function toggleCheck(name,i,v){checks[`${name}|${i}`]=v;save('checks',checks)}
function openProf(d,time,title){const content=document.getElementById('panelContent');content.innerHTML=`<div class="section"><h3>👨‍🏫 Mes groupes du samedi</h3><div class="prof-grid" id="profGrid"></div><div class="footer-note">Chaque groupe possède sa propre zone de notes.</div></div><div class="section"><h3>📝 Brouillon général</h3><textarea class="notearea" id="profGeneral" placeholder="Planning général, rappels..."></textarea><div class="save-status" id="profGeneralSave"></div></div>`;const grid=document.getElementById('profGrid');profGroups.forEach(g=>{const c=document.createElement('div');c.className='prof-card';c.innerHTML=`<h4>${g.name}</h4><div class="timebig">${g.time}</div><div class="muted">${g.level}</div>`;const ta=document.createElement('textarea');ta.className='notearea';ta.style.marginTop='10px';ta.placeholder='Notes pour ce groupe...';ta.value=profNotes[g.id]||'';const st=document.createElement('div');st.className='save-status';ta.addEventListener('input',()=>{profNotes[g.id]=ta.value;save('profNotes',profNotes);st.textContent='✓ Enregistré automatiquement'});c.append(ta,st);grid.appendChild(c)});const generalKey=keyFor(dateKey(d),time,title),ta=document.getElementById('profGeneral');ta.value=notes[generalKey]||'';ta.addEventListener('input',()=>{notes[generalKey]=ta.value;save('notes',notes);document.getElementById('profGeneralSave').textContent='✓ Enregistré automatiquement'})}
function openEditor(d,index){editing={dateKey:dateKey(d),index};const events=eventsForDate(d);const e=index===null?['','course','course']:events[index];document.getElementById('editorDateLabel').textContent=`${dayNames[d.getDay()]} ${d.getDate()} ${monthNames[d.getMonth()]}${index===null?' • nouvelle case':''}`;document.getElementById('eventTime').value=e[0]||'';document.getElementById('eventTitle').value=e[1]||'';document.getElementById('eventType').value=e[2]||'course';document.getElementById('deleteEventBtn').style.display=index===null?'none':'inline-block';document.getElementById('editorModal').classList.add('open')}
function closeEditor(){document.getElementById('editorModal').classList.remove('open');editing={dateKey:null,index:null}}
document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();const d=new Date(editing.dateKey+'T12:00:00'),events=eventsForDate(d),time=document.getElementById('eventTime').value.trim(),title=document.getElementById('eventTitle').value.trim(),type=document.getElementById('eventType').value;if(!time||!title)return;let action='';if(type==='workout'&&['PUSH','PULL','FULL BODY','LEGS'].includes(title))action='workout:'+title;if(type==='prof')action='prof';const item=[time,title,type];if(action)item.push(action);if(editing.index===null)events.push(item);else events[editing.index]=item;events.sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'fr',{numeric:true}));setEventsForDate(d,events);closeEditor();render()});
document.getElementById('deleteEventBtn').addEventListener('click',()=>{if(editing.index===null)return;const d=new Date(editing.dateKey+'T12:00:00'),events=eventsForDate(d);if(!confirm('Supprimer cette case ?'))return;events.splice(editing.index,1);setEventsForDate(d,events);closeEditor();render()});document.getElementById('cancelEditBtn').addEventListener('click',closeEditor);document.getElementById('editorModal').addEventListener('click',e=>{if(e.target.id==='editorModal')closeEditor()});
document.getElementById('prevBtn').addEventListener('click',()=>{selectedDate=new Date(selectedDate);selectedDate.setDate(selectedDate.getDate()-7);render()});document.getElementById('nextBtn').addEventListener('click',()=>{selectedDate=new Date(selectedDate);selectedDate.setDate(selectedDate.getDate()+7);render()});document.getElementById('todayBtn').addEventListener('click',()=>{selectedDate=startOfWeek(new Date());render()});document.getElementById('editModeBtn').addEventListener('click',()=>alert('Tu peux modifier une case avec ✏️, ou ajouter une nouvelle case en bas de chaque journée. Les changements sont enregistrés pour cette date uniquement.'));document.getElementById('closePanel').addEventListener('click',()=>document.getElementById('panel').classList.remove('active'));document.getElementById('clearChecksBtn').addEventListener('click',()=>{checks={};save('checks',checks);alert('Les cases cochées ont été réinitialisées.');render()});document.getElementById('resetBtn').addEventListener('click',()=>{if(!confirm('Restaurer les exercices d’origine ? Tes notes et liens seront conservés.'))return;workouts=structuredClone(defaultWorkouts);save('workouts',workouts);render()});document.getElementById('infoBtn').addEventListener('click',()=>alert('📅 Calendrier : utilise les dates et les flèches pour changer de semaine.\n\n✏️ Modifier : chaque case peut être renommée, déplacée dans un autre horaire, changée de type ou supprimée.\n\n➕ Ajouter une case : ajoute un cours, une révision ou une séance pour une date précise.\n\n🏋️ Sport : les exercices, séries/reps peuvent être modifiés, ajoutés, dupliqués ou supprimés.\n\n📝 Notes et 🔗 liens : disponibles sur les cases.\n\nLes changements sont enregistrés automatiquement dans ce navigateur.'));
render();
</script>
